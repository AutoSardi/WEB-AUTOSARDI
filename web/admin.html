<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Privado — Automóviles Sardi</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --accent: #dc2626; --green: #16a34a; --text: #f8fafc; --muted: #94a3b8; --border: #334155; }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; max-width: 720px; margin-inline: auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  input, select, textarea { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 1rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 14px; color: white; }
  .btn-primary { background: var(--green); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-dark { background: #334155; }
  .btn-del { background: var(--accent); padding: 8px 12px; font-size: 0.85rem; width: auto; margin: 0; }
  .btn-edit { background: #2563eb; padding: 8px 12px; font-size: 0.85rem; width: auto; margin: 0; }
  .car-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .car-item:last-child { border-bottom: none; }
  .car-item img { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; background: #0f172a; }
  .car-info { flex: 1; }
  .car-title { font-weight: 700; font-size: 0.98rem; }
  .car-meta { font-size: 0.82rem; color: var(--muted); }
  .car-actions { display: flex; gap: 6px; }
  .msg-box { padding: 12px; border-radius: 8px; margin-top: 12px; display: none; font-weight: 600; font-size: 0.92rem; }
  .ok { background: #14532d; color: #bbf7d0; border: 1px solid #16a34a; }
  .err { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }
  .loading { background: #1e3a8a; color: #bfdbfe; border: 1px solid #3b82f6; }
  .preview-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .preview-row img { width: 68px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
  .hidden { display: none; }
</style>
</head>
<body>

  <h1>Automóviles Sardi — Panel Móvil</h1>
  <div class="sub">Gestiona tus coches y fotos directo en automovilessardi.es</div>

  <div class="card" id="loginCard">
    <h2>1. Conectar con tu llave secreta</h2>
    <label>Pega tu token de GitHub (github_pat_...)</label>
    <input type="password" id="tokenInput" placeholder="github_pat_...">
    <div id="loginStatus" class="msg-box"></div>
    <button type="button" class="btn-primary" id="btnConnect">Conectar y cargar coches</button>
  </div>

  <div id="panelArea" class="hidden">
    <div class="card">
      <h2 id="formTitle">Añadir coche nuevo</h2>
      <input type="hidden" id="editIndex" value="-1">

      <div class="grid">
        <div>
          <label>Marca *</label>
          <input type="text" id="marca" placeholder="Ej: Peugeot">
        </div>
        <div>
          <label>Modelo *</label>
          <input type="text" id="modelo" placeholder="Ej: 5008">
        </div>
      </div>

      <label>Versión / Motor</label>
      <input type="text" id="version" placeholder="Ej: 1.6 BlueHDi 120cv">

      <div class="grid">
        <div>
          <label>Año *</label>
          <input type="number" id="anio" placeholder="Ej: 2018">
        </div>
        <div>
          <label>Kilómetros *</label>
          <input type="text" id="km" placeholder="Ej: 115000">
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Combustible</label>
          <select id="combustible">
            <option value="Diésel">Diésel</option>
            <option value="Gasolina">Gasolina</option>
            <option value="Híbrido">Híbrido</option>
            <option value="Eléctrico">Eléctrico</option>
            <option value="GLP">GLP</option>
          </select>
        </div>
        <div>
          <label>Cambio</label>
          <select id="cambio">
            <option value="Manual">Manual</option>
            <option value="Automático">Automático</option>
          </select>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Potencia (CV)</label>
          <input type="number" id="cv" placeholder="Ej: 120">
        </div>
        <div>
          <label>Precio (€) *</label>
          <input type="text" id="precio" placeholder="Ej: 12900">
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Carrocería</label>
          <select id="carroceria">
            <option value="Turismo">Turismo</option>
            <option value="SUV / 4x4">SUV / 4x4</option>
            <option value="Monovolumen">Monovolumen</option>
            <option value="Familiar">Familiar</option>
            <option value="Utilitario">Utilitario</option>
            <option value="Furgoneta">Furgoneta</option>
          </select>
        </div>
        <div>
          <label>Tipo (filtro web)</label>
          <select id="tipo">
            <option value="turismo">turismo</option>
            <option value="suv">suv</option>
            <option value="furgoneta">furgoneta</option>
          </select>
        </div>
      </div>

      <label>Fotos del coche (puedes elegir varias a la vez; la 1ª será la portada) *</label>
      <input type="file" id="fotoFile" accept="image/*" multiple>
      <div id="previewRow" class="preview-row"></div>

      <div id="formStatus" class="msg-box"></div>

      <button type="button" class="btn-primary" id="saveBtn">Publicar coche en la web</button>
      <button type="button" class="btn-dark hidden" id="cancelBtn">Cancelar edición</button>
    </div>

    <div class="card">
      <h2>Coches publicados (<span id="count">0</span>)</h2>
      <div id="listStatus" class="msg-box"></div>
      <div id="carList"></div>
    </div>

    <button type="button" class="btn-dark" id="btnLogout">Cambiar llave secreta</button>
  </div>

<script>
  const OWNER = 'AutoSardi';
  const REPO = 'WEB-AUTOSARDI';
  const DATA_PATH = 'web/js/data.js';
  let TOKEN = localStorage.getItem('sardi_gh_token') || '';
  let coches = [];
  let dataSha = '';

  function showMsg(boxId, text, type) {
    const el = document.getElementById(boxId);
    el.textContent = text;
    el.className = 'msg-box ' + (type || 'loading');
    el.style.display = 'block';
  }

  function cleanNum(val) {
    if (!val) return 0;
    const digits = String(val).replace(/[^0-9]/g, '');
    return digits ? Number(digits) : 0;
  }

  function b64EncodeUnicode(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(_, p1) {
      return String.fromCharCode('0x' + p1);
    }));
  }

  function b64DecodeUnicode(str) {
    return decodeURIComponent(atob(str).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
  }

  async function ghApi(path, method, body) {
    const opts = {
      method: method || 'GET',
      headers: {
        'Authorization': 'Bearer ' + TOKEN,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      }
    };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    const res = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + path + '?t=' + Date.now(), opts);
    if (!res.ok) throw new Error('Error GitHub (' + res.status + ')');
    return res.json();
  }

  async function conectar() {
    TOKEN = document.getElementById('tokenInput').value.trim();
    if (!TOKEN) return showMsg('loginStatus', 'Pega primero tu llave secreta.', 'err');
    showMsg('loginStatus', 'Conectando y leyendo coches...', 'loading');
    try {
      const file = await ghApi(DATA_PATH);
      dataSha = file.sha;
      const content = b64DecodeUnicode(file.content.replace(/\n/g, ''));
      const start = content.indexOf('[');
      const end = content.lastIndexOf('];');
      if (start === -1 || end === -1) throw new Error('No se encontró la lista en data.js');
      const jsonStr = content.slice(start, end + 1);
      coches = JSON.parse(jsonStr);
      localStorage.setItem('sardi_gh_token', TOKEN);
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('panelArea').classList.remove('hidden');
      renderList();
    } catch (e) {
      showMsg('loginStatus', 'Error al conectar: ' + e.message, 'err');
    }
  }

  function renderList() {
    document.getElementById('count').textContent = coches.length;
    const list = document.getElementById('carList');
    list.innerHTML = '';
    coches.forEach(function(c, idx) {
      const precioVal = c.precio || c.precioso || 0;
      const anioVal = c.anio || c.Anio || '';
      const numFotos = Array.isArray(c.fotos) ? c.fotos.length : 1;
      const div = document.createElement('div');
      div.className = 'car-item';
      div.innerHTML =
        '<img src="img/coches/' + c.id + '-sm.jpg?v=' + Date.now() + '" onerror="this.src=\'img/coches/' + c.id + '.jpg\'">' +
        '<div class="car-info">' +
          '<div class="car-title">' + c.marca + ' ' + c.modelo + '</div>' +
          '<div class="car-meta">' + anioVal + ' · ' + Number(c.km || 0).toLocaleString('es-ES') + ' km · ' + Number(precioVal).toLocaleString('es-ES') + ' € · ' + numFotos + ' foto(s)</div>' +
        '</div>' +
        '<div class="car-actions">' +
          '<button type="button" class="btn-edit" data-idx="' + idx + '">Editar</button>' +
          '<button type="button" class="btn-del" data-idx="' + idx + '">Borrar</button>' +
        '</div>';
      list.appendChild(div);
    });

    list.querySelectorAll('.btn-edit').forEach(function(b) {
      b.onclick = function() { editarCoche(Number(b.getAttribute('data-idx'))); };
    });
    list.querySelectorAll('.btn-del').forEach(function(b) {
      b.onclick = function() { borrarCoche(Number(b.getAttribute('data-idx'))); };
    });
  }

  document.getElementById('fotoFile').onchange = function() {
    const row = document.getElementById('previewRow');
    row.innerHTML = '';
    const files = this.files;
    for (let i = 0; i < files.length; i++) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(files.item(i));
      row.appendChild(img);
    }
  };

  function editarCoche(idx) {
    const c = coches.at(idx);
    document.getElementById('editIndex').value = idx;
    document.getElementById('formTitle').textContent = 'Editando: ' + c.marca + ' ' + c.modelo;
    document.getElementById('marca').value = c.marca || '';
    document.getElementById('modelo').value = c.modelo || '';
    document.getElementById('version').value = c.version || c['versión'] || '';
    document.getElementById('anio').value = c.anio || c.Anio || '';
    document.getElementById('km').value = c.km || '';
    document.getElementById('combustible').value = c.combustible || 'Diésel';
    document.getElementById('cambio').value = c.cambio || 'Manual';
    document.getElementById('cv').value = c.cv || c.CV || '';
    document.getElementById('precio').value = c.precio || c.precioso || '';
    document.getElementById('carroceria').value = c.carroceria || 'Turismo';
    document.getElementById('tipo').value = c.tipo || 'turismo';
    document.getElementById('saveBtn').textContent = 'Guardar cambios';
    document.getElementById('cancelBtn').classList.remove('hidden');
    document.getElementById('formStatus').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    document.getElementById('editIndex').value = '-1';
    document.getElementById('formTitle').textContent = 'Añadir coche nuevo';
    ['marca','modelo','version','anio','km','cv','precio','fotoFile'].forEach(function(id) {
      document.getElementById(id).value = '';
    });
    document.getElementById('previewRow').innerHTML = '';
    document.getElementById('saveBtn').textContent = 'Publicar coche en la web';
    document.getElementById('cancelBtn').classList.add('hidden');
  }

  function resizeImage(file, maxWidth) {
    return new Promise(function(resolve) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          const commaPos = dataUrl.indexOf(',');
          resolve(dataUrl.slice(commaPos + 1));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function uploadPhoto(path, base64Content) {
    let sha = null;
    try {
      const existing = await ghApi(path);
      sha = existing.sha;
    } catch (_) {}
    const payload = { message: 'Subir foto ' + path, content: base64Content };
    if (sha) payload.sha = sha;
    await ghApi(path, 'PUT', payload);
  }

  function slugify(text) {
    return text.toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  async function guardarCoche() {
    const marca = document.getElementById('marca').value.trim();
    const modelo = document.getElementById('modelo').value.trim();
    const anio = cleanNum(document.getElementById('anio').value);
    const km = cleanNum(document.getElementById('km').value);
    const precio = cleanNum(document.getElementById('precio').value);
    const editIdx = Number(document.getElementById('editIndex').value);
    const fileInput = document.getElementById('fotoFile');

    if (!marca || !modelo || !anio || !precio) {
      return showMsg('formStatus', 'Faltan datos: rellena Marca, Modelo, Año y Precio.', 'err');
    }
    if (editIdx === -1 && fileInput.files.length === 0) {
      return showMsg('formStatus', 'Selecciona al menos 1 foto del coche antes de publicar.', 'err');
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;

    try {
      const id = editIdx >= 0 ? coches.at(editIdx).id : slugify(marca) + '-' + slugify(modelo) + '-' + anio;
      let listaFotos = (editIdx >= 0 && Array.isArray(coches.at(editIdx).fotos)) ? coches.at(editIdx).fotos.slice() : ['img/coches/' + id + '.jpg'];

      if (fileInput.files.length > 0) {
        listaFotos = [];
        const total = fileInput.files.length;
        for (let i = 0; i < total; i++) {
          showMsg('formStatus', 'Subiendo foto ' + (i + 1) + ' de ' + total + '...', 'loading');
          const file = fileInput.files.item(i);
          const lgB64 = await resizeImage(file, 1280);
          if (i === 0) {
            const smB64 = await resizeImage(file, 480);
            await uploadPhoto('web/img/coches/' + id + '.jpg', lgB64);
            await uploadPhoto('web/img/coches/' + id + '-sm.jpg', smB64);
            listaFotos.push('img/coches/' + id + '.jpg');
          } else {
            const extraPath = 'img/coches/' + id + '-' + (i + 1) + '.jpg';
            await uploadPhoto('web/' + extraPath, lgB64);
            listaFotos.push(extraPath);
          }
        }
      }

      showMsg('formStatus', 'Guardando anuncio en la web...', 'loading');

      const nuevo = {
        id: id,
        marca: marca,
        modelo: modelo,
        version: document.getElementById('version').value.trim(),
        anio: anio,
        km: km,
        combustible: document.getElementById('combustible').value,
        cambio: document.getElementById('cambio').value,
        cv: cleanNum(document.getElementById('cv').value),
        carroceria: document.getElementById('carroceria').value,
        tipo: document.getElementById('tipo').value,
        precio: precio,
        fotos: listaFotos
      };

      if (editIdx >= 0) coches.splice(editIdx, 1, nuevo);
      else coches.push(nuevo);

      await syncDataJs('Publicar ' + marca + ' ' + modelo);
      resetForm();
      renderList();
      showMsg('formStatus', '¡LISTO! Anuncio publicado y añadido abajo en la lista (en 20s sale en automovilessardi.es).', 'ok');
    } catch (e) {
      showMsg('formStatus', 'Error al publicar: ' + e.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  async function borrarCoche(idx) {
    const c = coches.at(idx);
    if (!confirm('¿Seguro que quieres borrar el ' + c.marca + ' ' + c.modelo + '?')) return;
    showMsg('listStatus', 'Borrando ' + c.marca + ' ' + c.modelo + '...', 'loading');
    try {
      coches.splice(idx, 1);
      await syncDataJs('Borrar ' + c.marca + ' ' + c.modelo);
      renderList();
      showMsg('listStatus', 'Anuncio eliminado correctamente.', 'ok');
    } catch (e) {
      showMsg('listStatus', 'Error al borrar: ' + e.message, 'err');
    }
  }

  async function syncDataJs(commitMsg) {
    const latest = await ghApi(DATA_PATH);
    dataSha = latest.sha;
    const raw = b64DecodeUnicode(latest.content.replace(/\n/g, ''));
    const start = raw.indexOf('[');
    const end = raw.lastIndexOf('];');
    const newJson = JSON.stringify(coches, null, 2);
    const updated = raw.slice(0, start) + newJson + raw.slice(end + 1);
    const res = await ghApi(DATA_PATH, 'PUT', {
      message: commitMsg,
      content: b64EncodeUnicode(updated),
      sha: dataSha
    });
    dataSha = res.content.sha;
  }

  document.getElementById('btnConnect').onclick = conectar;
  document.getElementById('saveBtn').onclick = guardarCoche;
  document.getElementById('cancelBtn').onclick = resetForm;
  document.getElementById('btnLogout').onclick = function() {
    localStorage.removeItem('sardi_gh_token');
    location.reload();
  };

  if (TOKEN) {
    document.getElementById('tokenInput').value = TOKEN;
    conectar();
  }
</script>
</body>
</html>
